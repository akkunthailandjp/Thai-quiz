<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高松発！タイ旅クイズチャレンジ</title>
  <style>
    :root {
      --primary: #00247d;
      --accent: #ed1c24;
      --gold: #d4af37;
      --teal: #008080;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #00247d 0%, #004d7a 50%, #008793 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .quiz-card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .banner {
      height: 8px;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 33%, #ffffff 33%, #ffffff 66%, var(--primary) 66%, var(--primary) 100%);
    }

    .header-sub {
      font-size: 0.75rem;
      color: var(--teal);
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-top: 8px;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--primary);
      margin: 6px 0 14px;
    }

    .progress-bar-bg {
      background: #e2e8f0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--gold), var(--accent));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sound-toggle {
      background: #edf2f7;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text);
    }

    .question {
      font-size: 1.05rem;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 16px;
      text-align: left;
    }

    /* 音声クイズ再生ボタン */
    .audio-box {
      margin-bottom: 18px;
      display: none;
    }

    .btn-audio {
      background: linear-gradient(135deg, #ff9900, #ff5500);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-audio:active {
      transform: scale(0.97);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-option {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .btn-option.correct {
      background-color: #e6fffa;
      border-color: #38b2ac;
      color: #234e52;
    }

    .btn-option.wrong {
      background-color: #fff5f5;
      border-color: #e53e3e;
      color: #742a2a;
    }

    .explanation-box {
      background: #fffaf0;
      border-left: 4px solid var(--gold);
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 16px;
      display: none;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--primary), #0044cc);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 36, 125, 0.25);
    }

    /* プレゼント引換券（1人1回制限用） */
    .coupon-card {
      border: 2px dashed var(--gold);
      background: linear-gradient(135deg, #fffdf7 0%, #fff5d6 100%);
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0;
      position: relative;
    }

    .coupon-card.used {
      background: #edf2f7;
      border-color: #cbd5e0;
      color: #718096;
    }

    .live-clock {
      font-size: 0.8rem;
      font-family: monospace;
      color: #4a5568;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .btn-redeem {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    .btn-redeem:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .reset-secret {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #cbd5e0;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div class="banner"></div>
    <div class="header-sub">✈️ かがわそら博 タイ国政府観光庁ブース</div>
    <h1>🇹🇭 タイ旅クイズチャレンジ</h1>

    <!-- スタート画面 -->
    <div id="start-screen">
      <p style="font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px;">
        高松空港から乗り継ぎで楽々行けるタイのヒミツや、現地の「音」を当てるクイズに挑戦しよう！<br>
        <strong>参加賞のノベルティ引換券（お1人様1回限り）</strong>がもらえるよ🎁
      </p>
      <button class="btn-primary" onclick="startQuiz()">🔊 クイズをはじめる</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display: none;">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text">
        <span id="progress-label">第 1 問</span>
        <button class="sound-toggle" id="sound-btn" onclick="toggleSound()">🔊 効果音 ON</button>
      </div>

      <div class="question" id="question-text">読み込み中...</div>

      <!-- 音クイズ用の再生エリア -->
      <div class="audio-box" id="audio-box">
        <button class="btn-audio" onclick="playQuestionAudio()">
          🔊 クリックして音を聴く
        </button>
        <audio id="quiz-audio"></audio>
      </div>

      <div class="options" id="options-container"></div>
      <div class="explanation-box" id="explanation-text"></div>
      <button class="btn-primary" id="next-btn" style="display: none;" onclick="nextQuestion()">次の問題へ ➔</button>
    </div>

    <!-- 結果＆引換券画面 -->
    <div id="result-screen" style="display: none;">
      <h2 id="result-title" style="color: var(--primary); margin-bottom: 8px;">🎉 クイズ完了！</h2>
      <p id="final-score" style="font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 12px;"></p>

      <!-- お1人様1回限定の引換券 -->
      <div class="coupon-card" id="coupon-card">
        <div class="live-clock" id="live-clock">現在時刻: --:--:--</div>
        <h3 style="font-size: 1.05rem; margin-bottom: 6px;">🎁 TATブース ノベルティ引換券</h3>
        <p id="coupon-status-text" style="font-size: 0.85rem; line-height: 1.4;">
          この画面をブースのスタッフにお見せください。<br>（※お1人様1回限り有効です）
        </p>
        <button class="btn-redeem" id="redeem-btn" onclick="redeemPrize()">【スタッフ専用】引換済みにする</button>
      </div>

      <button class="btn-primary" style="background: var(--teal); margin-top: 8px;" onclick="restartPractice()">もう一度クイズで遊ぶ（練習モード）</button>
      
      <!-- スタッフ用隠しリセット（5回連続タップで初期化） -->
      <div class="reset-secret" onclick="secretReset()">TAT Takamatsu Event System</div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 【設定】Googleスプレッドシートの公開CSV URL（空欄なら下のデフォルト問題を使用）
    // 「ファイル」>「共有」>「ウェブに公開」>「カンマ区切り形式(.csv)」のURLを貼る
    // =========================================================================
    const SHEET_CSV_URL = ""; 

    // デフォルトのクイズデータ（スプレッドシート未設定時やオフライン時に使用）
    // audio にファイル名（例: "tuktuk.mp3"）を入れると音声ファイルを再生、
    // "TTS:タイ語の文字" を入れるとスマホの音声合成でタイ語を発音します！
    const defaultQuizData = [
      {
        question: "高松空港から台北経由（チャイナエアライン・スターラックス航空）でバンコクへ行く場合、預けたスーツケースはどうなる？",
        options: ["バンコクまで自動スルーで手ぶら移動！", "台北で一度受け取って運び直す", "機内にすべて持ち込む"],
        answer: 0,
        explanation: "正解！高松で預けた荷物はバンコクまでスルー。台北での乗り継ぎ時間は手ぶらでタピオカや小籠包を楽しめます！",
        audio: ""
      },
      {
        question: "【🔊音クイズ】ボタンをタップして声を聴いてね！このタイ語「サワディー・カー」はどういう意味？",
        options: ["こんにちは（挨拶）", "おなかすいた", "おやすみなさい"],
        answer: 0,
        explanation: "正解！「サワディー」は朝から晩まで使える便利な挨拶です。女性は語尾に「カー」、男性は「クラップ」をつけます。",
        audio: "TTS:สวัสดีค่ะ"
      },
      {
        question: "高松空港からソウル（仁川）や香港を経由してタイへ行く、若い世代に人気の旅のスタイルは？",
        options: ["乗り継ぎ時間で韓国カフェや飲茶も楽しむ「2カ国周遊」", "空港から一歩も出ない修行旅", "船に乗り換えて行く旅"],
        answer: 0,
        explanation: "正解！高松から直行便があるソウルや香港を経由すれば、1回の旅行で2カ国楽しめるお得な旅になります！",
        audio: ""
      }
    ];

    let quizData = [];
    let currentIndex = 0;
    let score = 0;
    let soundEnabled = true;
    let audioCtx = null;

    // スマホ1台につき1回制限用のストレージキー
    const STORAGE_KEY_PLAYED = "tat_soratabi_played_2026";
    const STORAGE_KEY_REDEEMED = "tat_soratabi_redeemed_2026";
    const STORAGE_KEY_SCORE = "tat_soratabi_score_2026";

    // ページ読み込み時に「すでにプレイ済みか」をチェック
    window.onload = async () => {
      startClock();
      await loadQuizData();

      if (localStorage.getItem(STORAGE_KEY_PLAYED) === "true") {
        // すでに1回クリアしている場合は、直接結果＆引換券画面を表示
        score = parseInt(localStorage.getItem(STORAGE_KEY_SCORE) || "0", 10);
        showResults(true);
      }
    };

    // スプレッドシート（CSV）から問題を読み込む関数
    async function loadQuizData() {
      if (!SHEET_CSV_URL) {
        quizData = defaultQuizData;
        return;
      }
      try {
        const res = await fetch(SHEET_CSV_URL);
        const csvText = await res.text();
        const rows = csvText.trim().split("\n").map(r => r.split(","));
        const headers = rows[0].map(h => h.trim());
        
        quizData = rows.slice(1).map(row => ({
          question: row[0]?.trim() || "",
          options: [row[1]?.trim() || "", row[2]?.trim() || "", row[3]?.trim() || ""],
          answer: parseInt(row[4]?.trim() || "0", 10),
          explanation: row[5]?.trim() || "",
          audio: row[6]?.trim() || ""
        })).filter(q => q.question !== "");

        if (quizData.length === 0) quizData = defaultQuizData;
      } catch (e) {
        console.warn("シート読み込み失敗のためデフォルト問題を使用します", e);
        quizData = defaultQuizData;
      }
    }

    // Web Audio APIによる効果音（外部ファイル不要でピンポン・ブーを鳴らす）
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(type) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === "correct") {
        // ピンポン♪（高音2連音）
        [660, 880].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.25, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.35);
        });
      } else if (type === "wrong") {
        // ブー…（低音）
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(160, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-btn").textContent = soundEnabled ? "🔊 効果音 ON" : "🔇 効果音 OFF";
    }

    // 音クイズの再生（MP3ファイル または タイ語音声合成）
    function playQuestionAudio() {
      const currentQuiz = quizData[currentIndex];
      if (!currentQuiz.audio) return;

      if (currentQuiz.audio.startsWith("TTS:")) {
        const text = currentQuiz.audio.replace("TTS:", "");
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = "th-TH";
        uttr.rate = 0.9;
        window.speechSynthesis.speak(uttr);
      } else {
        const audioEl = document.getElementById("quiz-audio");
        audioEl.src = currentQuiz.audio;
        audioEl.play();
      }
    }

    function startQuiz() {
      initAudio();
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      currentIndex = 0;
      score = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const currentQuiz = quizData[currentIndex];
      document.getElementById("progress-label").textContent = `第 ${currentIndex + 1} 問 / ${quizData.length} 問`;
      document.getElementById("progress-fill").style.width = `${((currentIndex) / quizData.length) * 100}%`;
      document.getElementById("question-text").textContent = currentQuiz.question;
      document.getElementById("explanation-text").style.display = "none";
      document.getElementById("next-btn").style.display = "none";

      // 音声問題かどうかでボタン表示を切り替え
      const audioBox = document.getElementById("audio-box");
      audioBox.style.display = currentQuiz.audio ? "block" : "none";

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      currentQuiz.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const currentQuiz = quizData[currentIndex];
      const buttons = document.getElementById("options-container").children;

      for (let btn of buttons) {
        btn.disabled = true;
      }

      if (selectedIndex === currentQuiz.answer) {
        buttons[selectedIndex].classList.add("correct");
        score++;
        playBeep("correct");
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[currentQuiz.answer].classList.add("correct");
        playBeep("wrong");
      }

      const expEl = document.getElementById("explanation-text");
      expEl.textContent = currentQuiz.explanation;
      expEl.style.display = "block";
      document.getElementById("next-btn").style.display = "block";
      document.getElementById("progress-fill").style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < quizData.length) {
        renderQuestion();
      } else {
        // 初回クリア時にスマホ本体へ記録を保存
        if (localStorage.getItem(STORAGE_KEY_PLAYED) !== "true") {
          localStorage.setItem(STORAGE_KEY_PLAYED, "true");
          localStorage.setItem(STORAGE_KEY_SCORE, score.toString());
        }
        showResults(false);
      }
    }

    function showResults(isReturningUser) {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "block";

      document.getElementById("final-score").textContent = `${score} / ${quizData.length} 問正解！`;
      updateCouponUI();
    }

    // 引換券の消込処理（スタッフ操作用）
    function redeemPrize() {
      if (localStorage.getItem(STORAGE_KEY_REDEEMED) === "true") return;
      const ok = confirm("【スタッフ確認】\nノベルティをお渡しし、この引換券を「使用済み」にしますか？\n（※一度押すと元に戻せません）");
      if (ok) {
        localStorage.setItem(STORAGE_KEY_REDEEMED, "true");
        updateCouponUI();
      }
    }

    function updateCouponUI() {
      const isRedeemed = localStorage.getItem(STORAGE_KEY_REDEEMED) === "true";
      const card = document.getElementById("coupon-card");
      const statusText = document.getElementById("coupon-status-text");
      const btn = document.getElementById("redeem-btn");

      if (isRedeemed) {
        card.classList.add("used");
        statusText.innerHTML = "<strong>【引換済み】</strong><br>ノベルティのお渡しは完了しています。ご参加ありがとうございました！";
        btn.textContent = "✅ 引換完了済み（お1人様1回限り）";
        btn.disabled = true;
      } else {
        card.classList.remove("used");
        statusText.innerHTML = "この画面をブースのスタッフにお見せください。<br>（※お1人様1回限り有効です）";
        btn.textContent = "【スタッフ専用】引換済みにする";
        btn.disabled = false;
      }
    }

    // 2回目以降の練習プレイ（引換券は復活しない）
    function restartPractice() {
      document.getElementById("result-screen").style.display = "none";
      startQuiz();
    }

    // スクショ防止用のリアルタイム時計
    function startClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString("ja-JP");
        const clockEl = document.getElementById("live-clock");
        if (clockEl) clockEl.textContent = `現在時刻: ${timeStr}`;
      }, 1000);
    }

    // スタッフテスト用の隠しリセット（画面下の薄い文字を5回タップで制限解除）
    let tapCount = 0;
    function secretReset() {
      tapCount++;
      if (tapCount >= 5) {
        if (confirm("【テスト用】このスマホのプレイ履歴・引換履歴をリセットしますか？")) {
          localStorage.removeItem(STORAGE_KEY_PLAYED);
          localStorage.removeItem(STORAGE_KEY_REDEEMED);
          localStorage.removeItem(STORAGE_KEY_SCORE);
          location.reload();
        }
        tapCount = 0;
      }
    }
  </script>
</body>
</html>
